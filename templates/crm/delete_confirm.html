{% extends "base.html" %}{% block title %}Delete record{% endblock %}{% block breadcrumb %}Confirm deletion{% endblock %}
{% block content %}<div class="delete-screen"><section class="panel delete-panel"><span class="delete-icon">⌫</span><div class="eyebrow"><i></i> CONFIRM ACTION</div><h1>Delete this record?</h1><p>You’re about to permanently delete <strong>{{ object }}</strong>. This action cannot be undone.</p><form method="post">{% csrf_token %}<div class="form-footer centered-footer"><a class="btn btn-soft" href="javascript:history.back()">Cancel</a><button type="submit" class="btn btn-danger">Delete permanently</button></div></form></section></div>{% endblock %}
