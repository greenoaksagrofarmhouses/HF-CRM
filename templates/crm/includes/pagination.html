{% if is_paginated %}<div class="pagination"><span>Showing page {{ page_obj.number }} of {{ paginator.num_pages }}</span><div class="pagination-actions">{% if page_obj.has_previous %}<a class="btn btn-soft btn-sm" href="?{% if request.GET.q %}q={{ request.GET.q|urlencode }}&{% endif %}{% if request.GET.status %}status={{ request.GET.status|urlencode }}&{% endif %}{% if request.GET.priority %}priority={{ request.GET.priority|urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-soft btn-sm" href="?{% if request.GET.q %}q={{ request.GET.q|urlencode }}&{% endif %}{% if request.GET.status %}status={{ request.GET.status|urlencode }}&{% endif %}{% if request.GET.priority %}priority={{ request.GET.priority|urlencode }}&{% endif %}page={{ page_obj.next_page_number }}">Next →</a>{% endif %}</div></div>{% endif %}
